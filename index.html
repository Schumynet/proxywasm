<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VixSrc Proxy + Video.js</title>

  <!-- Video.js -->
  <link href="https://vjs.zencdn.net/7.21.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/7.21.0/video.min.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 18px; background:#111; color:#eee; }
    .controls { margin-bottom: 12px; }
    input[type="text"], input[type="number"] { padding:6px; border-radius:4px; border:1px solid #444; background:#0f0f0f; color:#eee; }
    button { padding:6px 10px; margin-left:6px; border-radius:4px; border:none; background:#1f8fff; color:#fff; cursor:pointer; }
    .video-container { width:100%; max-width:1100px; height:620px; margin-top:12px; background:#000; position:relative; }
    .video-js { width:100%; height:100%; }
    pre#output { background:#0b0b0b; color:#9fd3ff; padding:10px; max-height:220px; overflow:auto; margin-top:12px; border-radius:6px; border:1px solid #222; }
  </style>
</head>
<body>
  <h1>VixSrc Proxy + Video.js</h1>

  <div class="controls">
    <label>TMDb ID <input id="tmdbId" type="text" placeholder="es. 182280"></label>
    <label><input id="isMovie" type="checkbox" checked> Movie</label>
    <label>Season <input id="season" type="number" min="1" style="width:70px"></label>
    <label>Episode <input id="episode" type="number" min="1" style="width:70px"></label>
    <button id="loadBtn">Carica</button>
    <button id="playTestMux">Play test Mux</button>
  </div>

  <div class="video-container" id="videoContainer">
    <video id="player" class="video-js vjs-big-play-centered" controls preload="auto"></video>
  </div>

  <h3>Log</h3>
  <pre id="output">Console log iniziale...[INIT] Frontend pronto. Inserisci TMDb ID e premi Carica.</pre>

  <script>
    const PROXY_PATH = "/.netlify/functions/proxy?url=";

    function log(...args) {
      const out = document.getElementById('output');
      const line = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
      console.log(...args);
      out.textContent += "\n" + line;
      out.scrollTop = out.scrollHeight;
    }

    async function fetchM3u8FromVixsrc(tmdbId, isMovie, season, episode) {
      const pageUrl = `https://vixsrc.to/${isMovie ? "movie" : "tv"}/${tmdbId}` + (!isMovie && season && episode ? `/${season}/${episode}` : "");
      log("🎬 Fetching stream from (via proxyfetch):", pageUrl);
      const res = await fetch(PROXY_PATH + encodeURIComponent(pageUrl));
      if (!res.ok) {
        const txt = await res.text().catch(()=>"");
        log("[ERROR] Extractor response:", res.status, txt);
        return null;
      }
      const json = await res.json().catch(()=>null);
      if (!json || !json.m3u8) {
        log("[ERROR] No m3u8 in extractor response:", json);
        return null;
      }
      log("✅ m3u8 ottenuto:", json.m3u8);
      return json.m3u8;
    }

    async function playM3u8(m3u8Url) {
      const player = videojs("player");
      const proxied = PROXY_PATH + encodeURIComponent(m3u8Url);
      log("[INFO] Avvio player con manifest proxato:", proxied);
      player.src({ src: proxied, type: "application/x-mpegURL" });
      try { await player.play(); } catch(e) { log("[WARN] play() rejected:", e.message || e); }
    }

    document.getElementById('loadBtn').addEventListener('click', async () => {
      const tmdbId = document.getElementById('tmdbId').value.trim();
      const isMovie = document.getElementById('isMovie').checked;
      const season = document.getElementById('season').value || null;
      const episode = document.getElementById('episode').value || null;
      if (!tmdbId) { log("[ERROR] Inserisci un TMDb ID"); return; }
      const m3u8 = await fetchM3u8FromVixsrc(tmdbId, isMovie, season, episode);
      if (m3u8) await playM3u8(m3u8);
    });

    document.getElementById('playTestMux').addEventListener('click', async () => {
      const testUrl = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";
      log("[TEST] Avvio test stream Mux via proxyfetch");
      await playM3u8(testUrl);
    });

    log("[INIT] Frontend pronto. Inserisci TMDb ID e premi Carica.");
  </script>
</body>
</html>
