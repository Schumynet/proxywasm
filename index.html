<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>CORS Proxy + HLS Player con estrazione stream</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
  <h1>Riproduzione HLS via Proxy</h1>

  <input id="tmdbId" type="text" placeholder="TMDb ID" size="20">
  <label><input type="checkbox" id="isMovie" checked> Movie</label>
  <input id="season" type="number" placeholder="Season" size="5">
  <input id="episode" type="number" placeholder="Episode" size="5">
  <button id="playBtn">Play</button>

  <video id="video" controls autoplay width="640" height="360"></video>
  <pre id="output"></pre>

  <script>
    const VIXSRC_URL = "vixsrc.to"; // dominio base

    function applyCorsProxy(url) {
      return `/.netlify/functions/proxy?url=${encodeURIComponent(url)}`;
    }

    function showLoading(active, msg="") {
      document.getElementById('output').textContent = active ? msg : "";
    }

    function showError(title, msg) {
      document.getElementById('output').textContent = title + ": " + msg;
    }

    function extractBaseUrl(url) {
      return url.split("?")[0];
    }

    async function getDirectStream(tmdbId, isMovie, season = null, episode = null) {
      try {
        showLoading(true, "Connessione al server...");

        let vixsrcUrl = `https://${VIXSRC_URL}/${isMovie ? "movie" : "tv"}/${tmdbId}`;
        if (!isMovie && season !== null && episode !== null) {
          vixsrcUrl += `/${season}/${episode}`;
        }

        console.log("🎬 Fetching stream from:", vixsrcUrl);

        showLoading(true, "Recupero pagina vixsrc...");
        const response = await fetch(applyCorsProxy(vixsrcUrl));
        const html = await response.text();

        console.log("✅ Page fetched successfully, length:", html.length);

        showLoading(true, "Estrazione parametri stream...");

        const playlistParamsRegex = /window\.masterPlaylist[^:]+params:[^{]+({[^<]+?})/;
        const playlistParamsMatch = html.match(playlistParamsRegex);

        if (!playlistParamsMatch) {
          console.error("❌ HTML Preview:", html.substring(0, 1000));
          throw new Error("Impossibile trovare i parametri della playlist");
        }

        let playlistParamsStr = playlistParamsMatch[1]
          .replace(/'/g, '"')
          .replace(/\s+/g, "")
          .replace(/\n/g, "")
          .replace(/\\n/g, "")
          .replace(",}", "}");

        console.log("📋 Playlist params string:", playlistParamsStr);

        let playlistParams;
        try {
          playlistParams = JSON.parse(playlistParamsStr);
        } catch (e) {
          console.error("❌ Failed to parse params:", playlistParamsStr);
          throw new Error("Errore nel parsing dei parametri: " + e.message);
        }

        console.log("✅ Parsed params:", playlistParams);

        const playlistUrlRegex = /window\.masterPlaylist\s*=\s*\{[\s\S]*?url:\s*'([^']+)'/;
        const playlistUrlMatch = html.match(playlistUrlRegex);

        if (!playlistUrlMatch) {
          throw new Error("Impossibile trovare l'URL della playlist");
        }

        const playlistUrl = playlistUrlMatch[1];
        console.log("🔗 Playlist URL:", playlistUrl);

        const canPlayFHDRegex = /window\.canPlayFHD\s+?=\s+?(\w+)/;
        const canPlayFHDMatch = html.match(canPlayFHDRegex);
        const canPlayFHD = canPlayFHDMatch && canPlayFHDMatch[1] === "true";

        console.log("🎥 Can play FHD:", canPlayFHD);

        const hasQuery = /\?[^#]+/.test(playlistUrl);
        const separator = hasQuery ? "&" : "?";

        const m3u8Url = playlistUrl + separator + "expires=" + playlistParams.expires + "&token=" + playlistParams.token + (canPlayFHD ? "&h=1" : "");

        console.log("🎬 Generated m3u8 URL:", m3u8Url);

        const baseStreamUrl = extractBaseUrl(m3u8Url);
        console.log("🏠 Base stream URL:", baseStreamUrl);

        showLoading(false);
        return { iframeUrl: vixsrcUrl, m3u8Url };
      } catch (error) {
        console.error("❌ Error in getDirectStream:", error);
        showLoading(false);
        showError("Errore durante l'estrazione dello stream", error.message);
        return null;
      }
    }

    async function playStream() {
      const tmdbId = document.getElementById('tmdbId').value;
      const isMovie = document.getElementById('isMovie').checked;
      const season = document.getElementById('season').value || null;
      const episode = document.getElementById('episode').value || null;

      const stream = await getDirectStream(tmdbId, isMovie, season, episode);
      if (!stream) return;

      const video = document.getElementById('video');
      const proxiedUrl = applyCorsProxy(stream.m3u8Url);

      if (Hls.isSupported()) {
        console.log("[INFO] hls.js supportato, carico:", proxiedUrl);
        const hls = new Hls();
        hls.loadSource(proxiedUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        console.log("[INFO] Safari/iOS: riproduzione nativa");
        video.src = proxiedUrl;
        video.play();
      } else {
        showError("Browser non supporta HLS", "");
      }
    }

    document.getElementById('playBtn').addEventListener('click', playStream);
  </script>
</body>
</html>
