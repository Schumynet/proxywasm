<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>CORS Proxy + Video.js Player</title>
  <!-- CSS di Video.js -->
  <link href="https://vjs.zencdn.net/7.21.0/video-js.css" rel="stylesheet" />
  <!-- JS di Video.js -->
  <script src="https://vjs.zencdn.net/7.21.0/video.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { margin: 5px; }
    pre { background: #eee; padding: 10px; max-height: 200px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Riproduzione HLS via Proxy con Video.js</h1>

  <h2>Inserisci URL diretto m3u8</h2>
  <input id="urlInput" type="text" size="100" placeholder="https://...m3u8?token=...&expires=...">
  <button id="playUrlBtn">Play URL</button>

  <h2>Player</h2>
  <video
    id="video"
    class="video-js vjs-default-skin"
    controls
    preload="auto"
    width="640"
    height="360"
    data-setup='{}'>
  </video>

  <h2>Log</h2>
  <pre id="output"></pre>

  <script>
    function applyCorsProxy(url) {
      return `/.netlify/functions/proxy?url=${encodeURIComponent(url)}`;
    }

    function log(msg) {
      console.log(msg);
      document.getElementById('output').textContent += msg + "\n";
    }

    function playM3u8(m3u8Url) {
      const proxiedUrl = applyCorsProxy(m3u8Url);
      log("[INFO] Riproduzione via proxy con Video.js: " + proxiedUrl);

      const player = videojs('video');
      player.src({
        src: proxiedUrl,
        type: 'application/x-mpegURL'
      });

      player.on('error', function() {
        const err = player.error();
        log("[ERRORE Video.js] " + (err ? err.message : "Errore sconosciuto"));
      });

      player.on('loadedmetadata', function() {
        log("[INFO] Metadata caricati, avvio playback");
        player.play();
      });
    }

    document.getElementById('playUrlBtn').addEventListener('click', () => {
      const url = document.getElementById('urlInput').value;
      if (url) playM3u8(url);
    });
  </script>
</body>
</html>
