<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>CORS Proxy + HLS Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
  <h1>Riproduzione HLS via Proxy</h1>

  <!-- Campo per inserire l'URL m3u8 -->
  <input id="urlInput" type="text" size="100"
         placeholder="Inserisci URL m3u8 con token">
  <button id="playBtn">Play</button>

  <!-- Video player -->
  <video id="video" controls autoplay width="640" height="360"></video>

  <pre id="output"></pre>

  <script>
    async function playThroughProxy(url) {
      try {
        // Costruisco l’endpoint del proxy Netlify
        const proxiedUrl = `/.netlify/functions/proxy?url=${encodeURIComponent(url)}`;

        const video = document.getElementById('video');

        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(proxiedUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          // Safari/iOS supporta HLS nativamente
          video.src = proxiedUrl;
          video.play();
        }
      } catch (err) {
        document.getElementById('output').textContent = "Errore: " + err.message;
      }
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      const url = document.getElementById('urlInput').value;
      if (url) playThroughProxy(url);
    });
  </script>
</body>
</html>
